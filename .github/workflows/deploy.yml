# Builds the dashboard and deploys it to Cloudflare Workers on every push to
# main. Needs two repository secrets (README, Hosting): CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The live site's flags, whatever the .env files say.
      - run: npm run build
        env:
          VITE_FLAG_COMPONENTS_PAGE: 'off'
          VITE_FLAG_ANALYTICS: 'off'
          VITE_FLAG_GA_DEBUG: 'off'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
